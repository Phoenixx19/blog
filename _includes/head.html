<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    {% if page.layout == 'blog' %}
    <meta property="og:type" content="article">
    <meta property="og:title" content="{{ page.title }}">
    <meta property="og:url" content="{{ page.url }}">

    {% if page.thumbnail %}
    <meta property="og:image" content="{{ page.thumbnail.src }}">
    {% endif %}
    <meta property="article:author" content="Phoenixx19">
    <!-- <meta property="article:published_time" content="2025-03-01T22:04+01:00"> -->
    
    {% if page.category %}
    <meta property="article:section" content="s">
    {% endif %}

    {% if page.tags %}
    {% for tag in page.tags %}
    <meta property="article:tag" content="{{ tag }}">
    {% endfor %}
    {% endif %}

    {% endif %}
    
    <title>{{ page.title }} - {{ site.title }}</title>
    <link rel="stylesheet" href="https://phoenixx.design/style.css">
    <link rel="stylesheet" href="{{ "/assets/css/highlighter.css" | relative_url }}">
    <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}">
    <script src="https://phoenixx.design/content/scripts/parallax.min.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@5.2.3/dist/ionicons/ionicons.esm.js"></script>
</head>
